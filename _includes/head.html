<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  /* Apply a stored light/dark choice before first paint. */
  (function () {
    try {
      var m = localStorage.getItem("veemax-mode");
      if (m === "light" || m === "dark") document.documentElement.setAttribute("data-mode", m);
    } catch (e) {}
  })();
</script>
